server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chess_analysis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:chess_user}
    password: ${DB_PASSWORD:chess_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    cookie-name: chess_session
    cookie-secure: ${COOKIE_SECURE:false}
    session-days: ${SESSION_DAYS:7}
  stockfish:
    path: ${STOCKFISH_PATH:stockfish}
    threads: ${STOCKFISH_THREADS:2}
    hash-mb: ${STOCKFISH_HASH_MB:128}
    position-timeout-seconds: ${STOCKFISH_POSITION_TIMEOUT_SECONDS:120}
    # Số tiến trình Stockfish sống tối đa. Mỗi tiến trình chiếm `threads` lõi và
    # `hash-mb` bộ nhớ, nên tích hai giá trị này quyết định tải của máy chủ.
    pool-size: ${STOCKFISH_POOL_SIZE:2}
    acquire-timeout-seconds: ${STOCKFISH_ACQUIRE_TIMEOUT_SECONDS:60}
    idle-timeout-seconds: ${STOCKFISH_IDLE_TIMEOUT_SECONDS:300}
  analysis:
    # Nên bằng pool-size: nhiều worker hơn engine chỉ làm các tác vụ giành nhau.
    workers: ${ANALYSIS_WORKERS:2}
    queue-capacity: ${ANALYSIS_QUEUE_CAPACITY:32}
  # Mô hình M2 đã xuất sang ONNX (python -m m2.export_onnx). Đường dẫn tính từ thư mục chạy
  # backend; thiếu file thì backend vẫn chạy, chỉ /api/human-moves trả 503.
  human-moves:
    model-path: ${M2_MODEL_PATH:../ml/models/m2.onnx}
  # Mô hình theo phong cách kỳ thủ (giai đoạn D) do ml/scripts/export_style_models.py xuất ra: styles.json,
  # <id>.onnx và <id>.book.json. Thiếu thư mục thì backend vẫn chạy, chỉ /api/styles báo chưa có mô hình.
  styles:
    dir: ${STYLE_MODELS_DIR:../ml/models/styles}
  # Tiêu chí lọc khi import Lichess Puzzle Database. Import chỉ chạy khi có tham số
  # --app.puzzles.import-file=<đường dẫn tới lichess_db_puzzle.csv.zst>.
  puzzles:
    per-band: 4000          # số puzzle tối đa mỗi dải rating
    band-width: 200         # độ rộng một dải rating
    min-rating: 600
    max-rating: 2999
    min-plays: 300          # đã được chơi đủ nhiều để rating đáng tin
    max-deviation: 90       # RatingDeviation tối đa
    min-popularity: 80      # thang -100..100, người chơi đánh giá tốt
    max-moves: 16           # độ dài tối đa của cột Moves (kể cả nước dàn dựng)
    seed: 1337              # cố định để chạy lại cho ra cùng một tập puzzle
