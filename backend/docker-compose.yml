services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chess_analysis
      MYSQL_USER: chess_user
      MYSQL_PASSWORD: chess_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - chess_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/chess_analysis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: chess_user
      DB_PASSWORD: chess_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      COOKIE_SECURE: "false"
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_THREADS: "2"
      STOCKFISH_HASH_MB: "128"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  chess_mysql_data:
