# Cấu hình chạy thử: mô hình tí hon, vài trăm bước, chạy được trên CPU.
#
#   python -m m2.train --config config/m2-smoke.yaml
#
# Mục đích là xác nhận pipeline chạy thông từ đầu đến cuối trước khi tốn hàng
# giờ GPU — không phải để có kết quả dùng được. Luôn chạy cái này trước khi bắt
# đầu một lượt huấn luyện thật.

data_dir: data/m2-smoke
run_dir: runs/m2-smoke

batch_size: 32
epochs: 1
lr: 0.001
warmup_steps: 20
num_workers: 0
shuffle_buffer: 1000

eval_every: 50
eval_batches: 5
log_every: 10
save_every: 100
val_rows: 2000

amp: false
max_steps: 100

model:
  channels: 32
  blocks: 2
  elo_dim: 16
  policy_channels: 8
  value_channels: 4
  value_head: true
