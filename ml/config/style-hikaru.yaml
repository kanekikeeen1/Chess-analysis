# D3 — fine-tune M2 nền theo phong cách Hikaru Nakamura.
#
#   python -m m2.train --config config/style-hikaru.yaml
#
# Chung cho ba file style-*.yaml (chỉ khác dữ liệu, số epoch và nhịp đánh giá):
# - Khởi tạo từ M2 v2; đóng băng stem, bộ mã hóa Elo và 4/10 khối đầu (đặc trưng bàn cờ chung),
#   học lại 6 khối sau và hai đầu ra. lr nhỏ hơn M2 gần 7 lần để không quên kiến thức nền.
# - Bước 0 đo chính M2 nền trên val của kỳ thủ; dừng sớm khi loss val không giảm sau 6 lần đánh giá,
#   tính cả mốc bước 0, nên nếu fine-tune không giúp gì thì nó dừng ngay.
# - Nakamura: 1,61M vị trí train (3.148 bước/epoch) → 3 epoch ≈ 9.400 bước.

data_dir: data/style/hikaru
run_dir: runs/style-hikaru
init_from: runs/m2-rtx5060ti-v2/best.pt
freeze_blocks: 4

batch_size: 512
epochs: 3
lr: 0.0003
min_lr: 0.00001
weight_decay: 0.0001
warmup_steps: 500
grad_clip: 1.0

value_loss_weight: 0.15
label_smoothing: 0.02

num_workers: 8
shuffle_buffer: 50000
prefetch_factor: 4

eval_every: 500
eval_batches: 40
log_every: 100
save_every: 2000
val_rows: 20000
early_stop_patience: 6

amp: true
seed: 1337
max_steps: null
