# D4 thí nghiệm đối chứng "cùng lượng dữ liệu": fine-tune GM chung theo phong cách Hikaru Nakamura,
# nhưng chỉ với số vị trí train bằng người ít dữ liệu nhất (Liêm, ~157k).
#
#   python scripts/prepare_style_data.py --equal-only
#   python -m m2.train --config config/style3-hikaru.yaml
#
# Ba file style3-*.yaml giống hệt nhau trừ dữ liệu: cùng số bước, cùng lr, nên chênh lệch trên đường chéo
# ma trận D4 chỉ còn do phong cách chứ không do lượng dữ liệu. So với style2: lr nhỏ hơn (1e-4) và đóng băng
# 6/10 khối, vì ở style2 loss val của Liêm/Carlsen tăng ngay từ những bước đầu (học quá khớp).

data_dir: data/style/equal/hikaru
run_dir: runs/style3-hikaru
init_from: runs/style-pool/best.pt
freeze_blocks: 6

batch_size: 512
epochs: 6
lr: 0.0001
min_lr: 0.00001
weight_decay: 0.0001
warmup_steps: 100
grad_clip: 1.0

value_loss_weight: 0.15
label_smoothing: 0.02

num_workers: 8
shuffle_buffer: 50000
prefetch_factor: 4

eval_every: 100
eval_batches: 40
log_every: 50
save_every: 1000
val_rows: 20000
early_stop_patience: 6

amp: true
seed: 1337
max_steps: null
